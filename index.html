<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المركز العلمي - تسجيل الدخول</title>
    <style>
        /* إعدادات الألوان المتناسقة مع هوية المركز العلمي */
        :root {
            --main-bg: #131b2f; /* لون الخلفية الكحلي الغامق */
            --card-bg: #1e2a47; /* لون الكارت */
            --primary-color: #00d4ff; /* لون سماوي للتميز */
            --text-light: #ffffff;
            --text-muted: #a0aabf;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--main-bg);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .login-card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 380px;
            text-align: center;
            border-top: 5px solid var(--primary-color);
        }

        .logo {
            width: 120px;
            height: 120px;
            border-radius: 15px;
            margin-bottom: 25px;
            object-fit: contain;
            background-color: #fff;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .login-title {
            margin-top: 0;
            margin-bottom: 30px;
            color: var(--primary-color);
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #2c3e50;
            background-color: var(--main-bg);
            color: var(--text-light);
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.3);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #00b4d8;
        }

        .error-msg {
            color: #ff4757;
            margin-top: 15px;
            font-size: 14px;
            display: none;
            font-weight: bold;
        }

        /* أنيميشن التحميل */
        .loader {
            display: none;
            border: 4px solid var(--main-bg);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 15px auto 0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="logo.jpeg" alt="لوجو المركز العلمي" class="logo" onerror="this.src='https://via.placeholder.com/120x120/ffffff/000000?text=Logo'">
        
        <h2 class="login-title">تسجيل الدخول</h2>

        <div class="input-group">
            <label>اسم المستخدم</label>
            <input type="text" id="username" placeholder="أدخل اسم المستخدم">
        </div>

        <div class="input-group">
            <label>رمز القسم</label>
            <input type="text" id="deptCode" placeholder="أدخل رمز القسم">
        </div>

        <div class="input-group">
            <label>كلمة المرور</label>
            <input type="password" id="password" placeholder="أدخل كلمة المرور">
        </div>

        <button class="login-btn" id="login-btn" onclick="processLogin()">دخول</button>
        <div class="loader" id="loader"></div>
        <div class="error-msg" id="error-msg"></div>
    </div>

    <script>
        // رابط الـ API الخاص بيكي اللي بيشاور على Google Apps Script
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwI2r-NhkhxH57Iexw_YcjXueto_dpX-pgqrCCcImStiw7FQEF-zkXZHSo2Wy1uGjDx/exec";

        function processLogin() {
            // جلب البيانات من الحقول
            const user = document.getElementById('username').value.trim();
            const dept = document.getElementById('deptCode').value.trim();
            const pass = document.getElementById('password').value.trim();
            
            const errorMsg = document.getElementById('error-msg');
            const loader = document.getElementById('loader');
            const btn = document.getElementById('login-btn');

            // التحقق من أن الحقول غير فارغة
            if(!user || !dept || !pass) {
                errorMsg.innerText = "يرجى تعبئة جميع الحقول أولاً!";
                errorMsg.style.display = "block";
                return;
            }

            // إخفاء الخطأ والزر، وإظهار التحميل
            errorMsg.style.display = "none";
            btn.style.display = "none";
            loader.style.display = "block";

            // تجهيز البيانات للإرسال بصيغة JSON
            const requestBody = {
                action: "login",
                username: user,
                deptCode: dept,
                password: pass
            };

            // إرسال الطلب لـ Google Apps Script باستخدام fetch
            fetch(SCRIPT_URL, {
                method: "POST",
                // إرسال كـ text/plain لتفادي مشاكل الـ CORS في المتصفح مع جيت هاب
                body: JSON.stringify(requestBody),
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                }
            })
            .then(response => response.json())
            .then(data => {
                loader.style.display = "none";
                
                if(data.success) {
                    // حفظ بيانات المستخدم في الجلسة (Session Storage)
                    sessionStorage.setItem('userInfo', JSON.stringify(data));
                    
                    // التوجيه للصفحة المناسبة بناءً على الرتبة
                    if(data.role === 'Admin') {
                        window.location.href = "admin.html";
                    } else {
                        window.location.href = "instructor.html";
                    }
                } else {
                    // إرجاع الزر وعرض رسالة الخطأ من السيرفر
                    btn.style.display = "block";
                    errorMsg.innerText = data.message;
                    errorMsg.style.display = "block";
                }
            })
            .catch(error => {
                loader.style.display = "none";
                btn.style.display = "block";
                errorMsg.innerText = "حدث خطأ في الاتصال بالسيرفر، يرجى المحاولة لاحقاً.";
                errorMsg.style.display = "block";
                console.error("Login Error:", error);
            });
        }

        // إضافة ميزة تسجيل الدخول عند الضغط على زر Enter
        document.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                processLogin();
            }
        });
    </script>
</body>
</html>
