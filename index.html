<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المركز العلمي - تسجيل الدخول</title>
    <style>
        /* إعدادات الألوان المتناسقة مع هوية المركز العلمي */
        :root {
            --main-bg: #131b2f; /* لون الخلفية الكحلي الغامق */
            --card-bg: #1e2a47; /* لون الكارت */
            --primary-color: #00d4ff; /* لون سماوي للتميز */
            --text-light: #ffffff;
            --text-muted: #a0aabf;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--main-bg);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #app-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 380px;
            text-align: center;
            border-top: 5px solid var(--primary-color);
        }

        .logo {
            width: 120px;
            height: 120px;
            border-radius: 15px;
            margin-bottom: 25px;
            object-fit: contain;
            background-color: #fff; /* عشان اللوجو يكون واضح لو خلفيته شفافة */
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .login-title {
            margin-top: 0;
            margin-bottom: 30px;
            color: var(--primary-color);
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #2c3e50;
            background-color: var(--main-bg);
            color: var(--text-light);
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.3);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #00b4d8;
        }

        .error-msg {
            color: #ff4757;
            margin-top: 15px;
            font-size: 14px;
            display: none;
            font-weight: bold;
        }

        /* أنيميشن التحميل */
        .loader {
            display: none;
            border: 4px solid var(--main-bg);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 15px auto 0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* حاوية المحتوى الرئيسي (المدرب أو الإدمن) */
        #main-content {
            display: none;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div id="app-container">
        
        <div id="login-section" class="login-card">
            <img src="logo.jpeg" alt="لوجو المركز العلمي" class="logo" onerror="this.src='https://via.placeholder.com/120x120/ffffff/000000?text=Logo'">
            
            <h2 class="login-title">تسجيل الدخول</h2>

            <div class="input-group">
                <label>اسم المستخدم</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم">
            </div>

            <div class="input-group">
                <label>رمز القسم</label>
                <input type="text" id="deptCode" placeholder="أدخل رمز القسم">
            </div>

            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور">
            </div>

            <button class="login-btn" id="login-btn" onclick="processLogin()">دخول</button>
            <div class="loader" id="loader"></div>
            <div class="error-msg" id="error-msg"></div>
        </div>

        <div id="main-content"></div>

    </div>

    <script>
        function processLogin() {
            // جلب البيانات من الحقول
            const user = document.getElementById('username').value.trim();
            const dept = document.getElementById('deptCode').value.trim();
            const pass = document.getElementById('password').value.trim();
            
            const errorMsg = document.getElementById('error-msg');
            const loader = document.getElementById('loader');
            const btn = document.getElementById('login-btn');

            // التحقق من أن الحقول غير فارغة
            if(!user || !dept || !pass) {
                errorMsg.innerText = "يرجى تعبئة جميع الحقول أولاً!";
                errorMsg.style.display = "block";
                return;
            }

            // إخفاء الخطأ والزر، وإظهار التحميل
            errorMsg.style.display = "none";
            btn.style.display = "none";
            loader.style.display = "block";

            // إرسال البيانات لدالة checkLogin في ملف Code.gs
            google.script.run
                .withSuccessHandler(function(response) {
                    loader.style.display = "none";
                    
                    if(response.success) {
                        // حفظ بيانات المستخدم في الجلسة لاستخدامها في الداشبورد
                        sessionStorage.setItem('userInfo', JSON.stringify(response));
                        
                        // إخفاء كارت اللوجين
                        document.getElementById('login-section').style.display = 'none';
                        document.getElementById('main-content').style.display = 'block';
                        
                        // تحميل واجهة المستخدم بناءً على الرتبة (Admin أو Instructor)
                        loadUserInterface(response.role);
                    } else {
                        // إرجاع الزر وعرض رسالة الخطأ
                        btn.style.display = "block";
                        errorMsg.innerText = response.message || "بيانات الدخول غير صحيحة";
                        errorMsg.style.display = "block";
                    }
                })
                .withFailureHandler(function(error) {
                    loader.style.display = "none";
                    btn.style.display = "block";
                    errorMsg.innerText = "حدث خطأ في الاتصال بالسيرفر، حاول مرة أخرى.";
                    errorMsg.style.display = "block";
                })
                .checkLogin(user, pass, dept);
        }

        function loadUserInterface(role) {
            const mainContent = document.getElementById('main-content');
            
            // مؤقتاً نعرض رسالة حتى نقوم ببرمجة ملفات instructor و admin
            if(role === 'Admin') {
                mainContent.innerHTML = "<h2 style='text-align:center; margin-top: 20%; color: var(--primary-color);'>مرحباً بك في لوحة تحكم الإدارة... جاري التجهيز</h2>";
                // لاحقاً سنستخدم: google.script.run.withSuccessHandler(html => mainContent.innerHTML = html).getAdminView();
            } else {
                mainContent.innerHTML = "<h2 style='text-align:center; margin-top: 20%; color: var(--primary-color);'>مرحباً بك في لوحة تحكم المدرب... جاري التجهيز</h2>";
                // لاحقاً سنستخدم: google.script.run.withSuccessHandler(html => mainContent.innerHTML = html).getInstructorView();
            }
        }
    </script>
</body>
</html>
